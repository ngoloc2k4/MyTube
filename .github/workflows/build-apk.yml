name: Build MyTube arm64-v8a APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: mytube-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Single Unified Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mytube-gradle-v1-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle*') }}
          restore-keys: |
            mytube-gradle-v1-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Prepare Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release keystore from GitHub Secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "Generating production-grade MyTube Release Keystore for CI"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias mytube_release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "mytube_release_2026" \
              -keypass "mytube_release_2026" \
              -dname "CN=MyTube, OU=Release, O=Lobie, C=VN"
            echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=mytube_release_2026" >> $GITHUB_ENV
            echo "KEY_ALIAS=mytube_release" >> $GITHUB_ENV
            echo "KEY_PASSWORD=mytube_release_2026" >> $GITHUB_ENV
          fi

      - name: Build Release APK and Run Empirical Benchmarks
        run: ./gradlew test assembleRelease --build-cache --parallel --stacktrace

      - name: Locate and prepare multi-ABI APKs
        run: |
          mkdir -p output-apk
          ARM64_FILE=$(find app/build/outputs/apk/ -type f -name "*arm64-v8a*.apk" | head -n 1)
          if [ -n "$ARM64_FILE" ]; then
            echo "Found arm64-v8a APK: $ARM64_FILE"
            cp "$ARM64_FILE" output-apk/MyTube-arm64-v8a.apk
          fi

          UNIVERSAL_FILE=$(find app/build/outputs/apk/ -type f -name "*universal*.apk" | head -n 1)
          if [ -n "$UNIVERSAL_FILE" ]; then
            echo "Found universal APK: $UNIVERSAL_FILE"
            cp "$UNIVERSAL_FILE" output-apk/MyTube-universal.apk
          fi

          ARMV7_FILE=$(find app/build/outputs/apk/ -type f -name "*armeabi-v7a*.apk" | head -n 1)
          if [ -n "$ARMV7_FILE" ]; then
            echo "Found armeabi-v7a APK: $ARMV7_FILE"
            cp "$ARMV7_FILE" output-apk/MyTube-armeabi-v7a.apk
          fi

          ls -lh output-apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyTube-APKs
          path: output-apk/*.apk
          if-no-files-found: error

      - name: Automatically Publish or Update Beta Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)
          TAG="v$VERSION"
          if [ -z "$VERSION" ]; then
            TAG="beta-latest"
          fi
          
          TITLE="MyTube $TAG (Auto-Build)"
          BODY="Bản build APK mới nhất được tự động cập nhật bởi GitHub Actions từ commit trên nhánh \`main\`.\n\n- **Commit**: \`${{ github.sha }}\`\n- **Action Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n- **Thời gian build**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')\n\n### 📦 Tệp cài đặt:\n- \`MyTube-arm64-v8a.apk\` (Tối ưu thiết bị 64-bit hiện đại, Android 7.0+)\n- \`MyTube-universal.apk\` (Tương thích mọi kiến trúc thiết bị Android)\n- \`MyTube-armeabi-v7a.apk\` (Tối ưu thiết bị 32-bit cũ)"
          
          echo "Processing release tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, updating assets..."
            gh release edit "$TAG" --title "$TITLE" --prerelease
            gh release upload "$TAG" output-apk/*.apk --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" output-apk/*.apk \
              --title "$TITLE" \
              --notes "$BODY" \
              --prerelease
          fi
