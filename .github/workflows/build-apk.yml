name: Build MyTube arm64-v8a APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: mytube-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Single Unified Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mytube-gradle-v1-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle*') }}
          restore-keys: |
            mytube-gradle-v1-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --build-cache --parallel --stacktrace

      - name: Locate and prepare arm64-v8a APK
        run: |
          mkdir -p output-apk
          APK_FILE=$(find app/build/outputs/apk/ -type f -name "*arm64-v8a*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Lưu ý: Không tìm thấy tên có chứa arm64-v8a, tìm file apk bất kỳ..."
            APK_FILE=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" output-apk/MyTube-arm64-v8a.apk

      - name: Upload arm64-v8a APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTube-arm64-v8a
          path: output-apk/MyTube-arm64-v8a.apk
          if-no-files-found: error

      - name: Automatically Publish or Update Beta Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)
          TAG="v$VERSION"
          if [ -z "$VERSION" ]; then
            TAG="beta-latest"
          fi
          
          TITLE="MyTube $TAG (Auto-Build)"
          BODY="Bản build APK mới nhất được tự động cập nhật bởi GitHub Actions từ commit trên nhánh \`main\`.\n\n- **Commit**: \`${{ github.sha }}\`\n- **Action Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n- **Thời gian build**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')\n\n### 📦 Tệp cài đặt:\n- \`MyTube-arm64-v8a.apk\` (Kiến trúc arm64-v8a, Android 7.0+)"
          
          echo "Processing release tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, updating asset..."
            gh release edit "$TAG" --title "$TITLE" --prerelease
            gh release upload "$TAG" output-apk/MyTube-arm64-v8a.apk --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" output-apk/MyTube-arm64-v8a.apk \
              --title "$TITLE" \
              --notes "$BODY" \
              --prerelease
          fi
