name: Build MyTube arm64-v8a APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate and prepare arm64-v8a APK
        run: |
          mkdir -p output-apk
          # Tìm đúng file APK sinh ra cho kiến trúc arm64-v8a
          APK_FILE=$(find app/build/outputs/apk/ -type f -name "*arm64-v8a*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Lưu ý: Không tìm thấy tên có chứa arm64-v8a, tìm file apk bất kỳ..."
            APK_FILE=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" output-apk/MyTube-arm64-v8a.apk

      - name: Upload arm64-v8a APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTube-arm64-v8a
          path: output-apk/MyTube-arm64-v8a.apk
          if-no-files-found: error
